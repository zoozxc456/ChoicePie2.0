name: Backend CI

on:
  push:
    branches: [master, 'feat-**']
    paths:
      - 'choicepie-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'choicepie-backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: choicepie-backend/ChoicePie.Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: choicepie-backend/ChoicePie.Backend/**/*.csproj

      - name: Restore
        run: dotnet restore ChoicePie.Backend.sln

      - name: Build
        run: dotnet build ChoicePie.Backend.sln -c Release --no-restore

      # WebApi.Tests and Persistence.Tests use Testcontainers (Docker is preinstalled on ubuntu runners).
      - name: Test
        run: >
          dotnet test ChoicePie.Backend.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: choicepie-backend/ChoicePie.Backend/TestResults/**/*.trx
          if-no-files-found: ignore
