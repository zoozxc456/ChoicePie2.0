name: E2E

on:
  push:
    branches: [master, develop, 'feat/**']
    paths:
      - 'choicepie-frontend/**'
      - 'choicepie-backend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'choicepie-frontend/**'
      - 'choicepie-backend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  multi-node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # 兩台後端 + 不開 sticky session 的 nginx + 兩個 Nuxt 正式版 build，見 e2e/compose.yaml。
      - name: Start stack
        run: pnpm stack:up

      - name: Test
        run: pnpm test

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: pnpm stack:down
