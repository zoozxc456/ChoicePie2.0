# 單一 worker：round-robin 的計數只有一份，REST 請求嚴格在兩台之間輪流。
worker_processes 1;

events {}

http {
  # 記下入口 port 與實際轉到哪一台，測試失敗時可以從 docker compose logs lb 看出請求的去向。
  log_format upstream '$remote_addr :$server_port "$request" $status -> $upstream_addr';
  access_log /dev/stdout upstream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 刻意不設 ip_hash / sticky：模擬沒有 sticky session 的負載平衡器。
  upstream backends {
    server backend-a:8080;
    server backend-b:8080;
  }

  upstream backend_a {
    server backend-a:8080;
  }

  upstream backend_b {
    server backend-b:8080;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  # 大於 SignalR 的 15s keepalive，閒置的 WebSocket 才不會被 nginx 切斷。
  proxy_read_timeout 60s;

  server {
    listen 8080;
    location / { proxy_pass http://backends; }
  }

  server {
    listen 8081;
    location / { proxy_pass http://backend_a; }
  }

  server {
    listen 8082;
    location / { proxy_pass http://backend_b; }
  }
}
